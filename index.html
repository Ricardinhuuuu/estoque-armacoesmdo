 (j.movimentos||[]).forEach(m=>{

 });

/* sincronização completa: envia pendentes e depois busca novidades */
async function sincronizar(opts){
 if(!syncAtivo()){syncStatus();return{ok:false,motivo:"desligado"}}
 const botao=$("syB");if(botao)botao.disabled=true;
 try{
  let confirmados=0,recusados=0;
  if(FILA.length){
   const j=await enviarLote(FILA.map(m=>Object.assign({},m,{aparelho:m.aparelho||aparelhoId()})));
   confirmar(j.confirmados||[]);
   confirmados=(j.confirmados||[]).length;
   recusados=(j.recusados||[]).length;
   /* recusado pelo servidor sai da fila e vira aviso: não pode ficar preso para sempre */
   if(recusados){
    const ids=new Set((j.recusados||[]).map(x=>x.id));
    FILA=FILA.filter(m=>!ids.has(m.id));sF();
    (j.recusados||[]).forEach(x=>avisar("Operação recusada pelo servidor: "+(x.motivo||"motivo não informado"),{alvo:x.id}));
   }
  }
  const novos=await receberNovidades();
  SYNC.ultimoOk=Date.now();SYNC.ultimoErro="";sS();
  if(!opts||!opts.silencioso)draw();
  syncStatus();
  return{ok:true,confirmados,recusados,novos};
 }catch(e){
  SYNC.ultimoErro=(e&&e.message)||"falha de rede";sS();syncStatus();
  return{ok:false,motivo:SYNC.ultimoErro};
 }finally{if(botao)botao.disabled=false}
}

 return M.filter(vivo).filter(m=>(m.ts||0)>=ini);
}
let REL={dias:30};
function relDados(){
 const movs=relPeriodo(),b=bal();
 const porProduto={},porOperador={};
 movs.forEach(m=>{
  const p=PP[idx[m.c]],nome=p?p[1]+" "+p[2]:m.c;
  const o=porProduto[m.c]||(porProduto[m.c]={nome,codigo:m.c,entradas:0,saidas:0,ajustes:0,total:0});
  if(m.t==="in")o.entradas+=Math.abs(m.q);else if(m.t==="out")o.saidas+=Math.abs(m.q);else o.ajustes+=Math.abs(m.q);
  o.total++;
  const k=m.u||"-",op=porOperador[k]||(porOperador[k]={login:k,nome:m.o||k,entradas:0,saidas:0,total:0});
  if(m.t==="in")op.entradas+=Math.abs(m.q);else if(m.t==="out")op.saidas+=Math.abs(m.q);
  op.total++;
 });
 const semMov=PP.filter((p,i)=>{if(!movs.some(m=>m.c===p[0]))return true;return false});
 return{
  periodo:REL.dias,
  produtos:Object.values(porProduto).sort((a,b2)=>b2.total-a.total),
  operadores:Object.values(porOperador).sort((a,b2)=>b2.total-a.total),
  baixo:PP.map((p,i)=>[p,b[i]]).filter(([p,v])=>MIN[p[0]]>0&&v<=MIN[p[0]]),
  zerados:PP.map((p,i)=>[p,b[i]]).filter(([p,v])=>v<=0),
  semMov,
  ajustes:movs.filter(m=>m.t==="adj").length,
  entradas:movs.filter(m=>m.t==="in").reduce((a,m)=>a+Math.abs(m.q),0),
  saidas:movs.filter(m=>m.t==="out").reduce((a,m)=>a+Math.abs(m.q),0)
 };
}

const PARADO=ls("mdo_parado",null)||{dias:0,ativo:true}; /* 0 = desligado */
function paradoDias(){return Math.max(0,Number(PARADO.dias)||0)}
/* produtos sem NENHUMA movimentação nos últimos N dias */
function parados(dias){
 const d=Number(dias);
 if(!(d>0))return [];           /* 0 ou vazio = desligado: não lista nada */
 const limite=Date.now()-d*86400000;
 const ultimo={};
 M.filter(vivo).forEach(m=>{const t=Number(m.ts)||0;if(!ultimo[m.c]||t>ultimo[m.c])ultimo[m.c]=t});
 return PP.filter(p=>{
  const base=+p[3]||0;
  const u=ultimo[p[0]]||0;
  if(base<=0&&!u)return false;           /* nunca teve estoque nem movimento: não é "parado", é vazio */
  return u<limite;
 }).map(p=>({codigo:p[0],nome:p[1]+" "+p[2],desde:ultimo[p[0]]||0}));
}

/* Quem movimentou cada produto, e onde a conta não fecha. Só leitura. */
const OPC={login:"",dias:30};
function opDados(){
 const d=new Date(),ini=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()-(Math.max(1,OPC.dias)-1)*86400000;
 const movs=M.filter(vivo).filter(m=>(m.ts||0)>=ini);
 const porOperador={};
 movs.forEach(m=>{
  const k=m.u||"-",o=porOperador[k]||(porOperador[k]={login:k,nome:m.o||k,produtos:{},total:0});
  o.total++;
  const p=PP[idx[m.c]],nome=p?p[1]+" "+p[2]:m.c;
  const it=o.produtos[m.c]||(o.produtos[m.c]={codigo:m.c,nome,entradas:0,saidas:0,ajustes:0,ultimo:0});
  if(m.t==="in")it.entradas+=Math.abs(m.q);else if(m.t==="out")it.saidas+=Math.abs(m.q);else it.ajustes+=Math.abs(m.q);
  it.ultimo=Math.max(it.ultimo,m.ts||0);
 });
 /* divergências: saldo negativo, baixa maior que o saldo inicial e estorno de outro operador */
 const b=bal(),divergencias=[];
 PP.forEach((p,i)=>{
  if(b[i]<0)divergencias.push({tipo:"saldo negativo",codigo:p[0],nome:p[1]+" "+p[2],detalhe:b[i]+" un."});
 });
 movs.filter(m=>m.t==="out").forEach(m=>{
  const i=idx[m.c];if(i==null)return;
  const inicial=+PP[i][3]||0;
  if(m.q>inicial)divergencias.push({tipo:"baixa maior que o inicial",codigo:m.c,nome:PP[i][1]+" "+PP[i][2],detalhe:m.q+" un. por "+(m.o||m.u)});
 });
 movs.filter(m=>m.est).forEach(m=>{
  const orig=M.find(x=>x.id===m.est);
  if(orig&&orig.u!==m.u)divergencias.push({tipo:"estorno de outro operador",codigo:m.c,nome:nomeP(m.c),detalhe:(m.o||m.u)+" estornou "+(orig.o||orig.u)});
 });
 const vistos=new Set(),unicas=[];
 divergencias.forEach(x=>{const k=x.tipo+"|"+x.codigo+"|"+x.detalhe;if(vistos.has(k))return;vistos.add(k);unicas.push(x)});
 return{periodo:OPC.dias,movs,operadores:Object.values(porOperador).sort((a,b2)=>b2.total-a.total),divergencias:unicas};
}

 return Object.keys(INV.itens||{}).map(c=>{

 });

function invConcluir(){
 if(!isA())return;
 /* a contagem é feita no modo Contagem; se só houver CNT, ele é o inventário */
 if(!Object.keys(INV.itens||{}).length&&Object.keys(CNT||{}).length)INV.itens=Object.assign({},CNT);
 const r=invResumo();

 const hist=ls("mdo_invh",[]);

 sP("invh",hist);
 try{localStorage.setItem("mdo_invh",JSON.stringify(hist))}catch(e){}

 /* o que foi concluído sai da contagem corrente: o próximo inventário começa zerado */
 CNT={};sC();

/* ===== 7.5 — Alertas e automações =====
   Regras: nunca repetir o mesmo aviso no mesmo dia; cada alerta tem um código fixo,
   então quando a situação melhora o aviso anterior é marcado como resolvido. */
const ALERTAS={
 zerado:{on:true,rot:"Produto zerado"},
 baixo:{on:true,rot:"Estoque baixo (no mínimo)"},
 pendente:{on:true,rot:"Movimentações pendentes de aprovação"},
 sync:{on:true,rot:"Falhas de sincronização e operações não confirmadas"},
 parado:{on:true,rot:"Produtos parados (sem movimentação)"},
 inventario:{on:true,rot:"Divergências de inventário"}
};
/* o administrador liga e desliga cada alerta; fica salvo no aparelho */
function alertaCfg(){const c=ls("mdo_alcfg",{});const o={};Object.keys(ALERTAS).forEach(k=>{o[k]=c[k]===undefined?ALERTAS[k].on:!!c[k]});return o}
function alertaConfigurar(k,v){
 /* guarda só o que o administrador mudou; o resto segue o padrão */
 const c=ls("mdo_alcfg",{});c[k]=!!v;
 try{localStorage.setItem("mdo_alcfg",JSON.stringify(c))}catch(e){}
 audit("ALERTAS",k,v?"ligado":"desligado");draw();
}
function alertaLigado(k){return alertaCfg()[k]!==false}
function alertas(){
 const b=bal(),av=ls(avKey,[]),hoje=new Date().toISOString().slice(0,10);
 const jaTem=(m,cod)=>av.some(a=>a.dia===hoje&&(cod?a.cod===cod:a.m===m));
 const novos=[];
 const push=(cod,m,extra)=>{if(!alertaLigado(cod))return;if(!jaTem(m,cod))novos.push(Object.assign({m,cod},extra||{}))};
 PP.forEach((p,i)=>{
  const v=b[i],mn=MIN[p[0]]||0;
  if(v<=0)push("zerado","Estoque zerado: "+p[1]+" "+p[2],{alvo:p[0]});
  else if(mn&&v<=mn)push("baixo","Estoque baixo: "+p[1]+" "+p[2]+" ("+v+", mín. "+mn+")",{alvo:p[0]});
 });
 if(FILA.length)push("sync","Falha de sincronização: "+FILA.length+" operação(ões) não confirmada(s)");
 if(REQ.length)push("pendente","Movimentações pendentes de aprovação: "+REQ.length);
 /* 10.3 — produto sem movimentação, no período que o administrador escolheu */
 const diasParado=paradoDias();
 if(diasParado){
  const p=parados(diasParado);
  if(p.length)push("parado","Produtos sem movimentação há "+diasParado+" dias: "+p.length);
 }
 /* 7.5 — divergências de inventário: contagens concluídas com diferença */

const PBI={periodo:30,tipo:"",operador:"",modelo:"",cor:"",cruz:null};
function pbiBase(){
 const d=new Date(),ini=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()-(PBI.periodo-1)*86400000;
 return M.filter(vivo).filter(m=>(m.ts||0)>=ini);
}
/* aplica os filtros do topo + o filtro cruzado do clique */
function pbiFiltrado(ignorar){
 const base=pbiBase();
 return base.filter(m=>{
  const p=PP[idx[m.c]];
  if(PBI.tipo&&m.t!==PBI.tipo)return false;
  if(PBI.operador&&m.u!==PBI.operador)return false;
  if(PBI.modelo&&(!p||p[1]!==PBI.modelo))return false;
  if(PBI.cor&&(!p||p[2]!==PBI.cor))return false;
  if(PBI.cruz&&PBI.cruz!==ignorar){
   if(PBI.cruz.tipo==="dia"&&new Date(m.ts).toISOString().slice(0,10)!==PBI.cruz.v)return false;
   if(PBI.cruz.tipo==="produto"&&m.c!==PBI.cruz.v)return false;
   if(PBI.cruz.tipo==="operador"&&m.u!==PBI.cruz.v)return false;
  }
  return true;
 });
}
function pbiDados(){
 const movs=pbiFiltrado(),b=bal();
 const dias={},produtos={},operadores={},grupo={};
 movs.forEach(m=>{
  const dia=new Date(m.ts).toISOString().slice(0,10);
  const d=dias[dia]||(dias[dia]={dia,entradas:0,saidas:0});
  const p=PP[idx[m.c]],nome=p?p[1]+" "+p[2]:m.c;
  const pr=produtos[m.c]||(produtos[m.c]={codigo:m.c,nome,entradas:0,saidas:0,total:0});
  const op=operadores[m.u||"-"]||(operadores[m.u||"-"]={login:m.u||"-",nome:m.o||m.u||"-",entradas:0,saidas:0,total:0});
  const chave=(p?p[1]+" · "+p[2]:"(fora do cadastro)");
  const g=grupo[chave]||(grupo[chave]={nome:chave,qtd:0});
  const q=Math.abs(m.q);
  if(m.t==="in"){d.entradas+=q;pr.entradas+=q;op.entradas+=q}
  else if(m.t==="out"){d.saidas+=q;pr.saidas+=q;op.saidas+=q}
  pr.total++;op.total++;
 });
 PP.forEach((p,i)=>{const chave=p[1]+" · "+p[2];const g=grupo[chave]||(grupo[chave]={nome:chave,qtd:0});g.qtd+=b[i]});
 const ultimo=movs.reduce((a,m)=>Math.max(a,m.ts||0),0);
 return{
  movs,
  dias:Object.values(dias).sort((a,b2)=>a.dia<b2.dia?-1:1),
  produtos:Object.values(produtos).sort((a,b2)=>b2.total-a.total),
  operadores:Object.values(operadores).sort((a,b2)=>b2.total-a.total),
  grupo:Object.values(grupo).filter(g=>g.qtd!==0).sort((a,b2)=>b2.qtd-a.qtd),
  atualizadoEm:ultimo||Date.now(),
  baixo:PP.map((p,i)=>[p,b[i]]).filter(([p,v])=>MIN[p[0]]>0&&v<=MIN[p[0]]),
  zerados:PP.map((p,i)=>[p,b[i]]).filter(([p,v])=>v<=0),
  pendentes:REQ.length
 };
}

async function apiContas(acao,dados){

/* desenha a imagem em canvas com ajustes: escala, cinza, contraste, nitidez, rotação e recorte */
function qCanvas(img,opt){
 const o=opt||{},maxLado=o.maxLado||1600;
 let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
 const k=Math.min(1,maxLado/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
 const rot=o.rot||0,girar=rot===90||rot===270;
 const cv=document.createElement("canvas");cv.width=girar?h:w;cv.height=girar?w:h;
 const cx=cv.getContext&&cv.getContext("2d");
 if(!cx)return cv;
 cx.save();
 cx.translate(cv.width/2,cv.height/2);cx.rotate((rot*Math.PI)/180);
 cx.drawImage(img,-w/2,-h/2,w,h);
 cx.restore();
 if(!o.cinza&&!o.contraste&&!o.nitidez)return cv;
 try{
  const d=cx.getImageData(0,0,cv.width,cv.height),px=d.data;
  if(o.cinza)for(let i=0;i<px.length;i+=4){const g=(px[i]*0.299+px[i+1]*0.587+px[i+2]*0.114)|0;px[i]=px[i+1]=px[i+2]=g}
  if(o.contraste){const f=Number(o.contraste)||1;
   for(let i=0;i<px.length;i+=4){px[i]=Math.min(255,Math.max(0,(px[i]-128)*f+128));px[i+1]=Math.min(255,Math.max(0,(px[i+1]-128)*f+128));px[i+2]=Math.min(255,Math.max(0,(px[i+2]-128)*f+128))}}
  if(o.nitidez){
   /* nitidez simples: pixel + (pixel − média dos 4 vizinhos) */
   const copia=new Uint8ClampedArray(px);
   const W=cv.width,H=cv.height,idx4=(x,y)=>(y*W+x)*4;
   for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=idx4(x,y);
    for(let c=0;c<3;c++){
     const media=(copia[idx4(x-1,y)+c]+copia[idx4(x+1,y)+c]+copia[idx4(x,y-1)+c]+copia[idx4(x,y+1)+c])/4;
     px[i+c]=Math.min(255,Math.max(0,copia[i+c]+(copia[i+c]-media)));
    }
   }
  }
  cx.putImageData(d,0,0);
 }catch(e){}
 return cv;
}
/* recorta uma região (proporção da imagem) e devolve canvas novo */
function qRecorte(cv,reg){
 const {x,y,w,h}=reg;
 const out=document.createElement("canvas");
 out.width=Math.max(1,Math.round(cv.width*w));out.height=Math.max(1,Math.round(cv.height*h));
 const c2=out.getContext&&out.getContext("2d");
 if(c2)c2.drawImage(cv,Math.round(cv.width*x),Math.round(cv.height*y),out.width,out.height,0,0,out.width,out.height);
 return out;
}
/* tenta decodificar um canvas pelo motor nativo */
async function qDetectarCanvas(cv){
 if(!("BarcodeDetector" in window))return null;
 let det;
 try{det=new BarcodeDetector({formats:FMT})}catch(e){try{det=new BarcodeDetector()}catch(x){return null}}
 /* sem timeout, um detector travado deixaria a consulta por foto sem resposta */
 const leitura=det.detect(cv).then(r=>(r&&r.length?String(r[0].rawValue):null)).catch(()=>null);
 return Promise.race([leitura,new Promise(r=>setTimeout(()=>r(null),3000))]);
}

/* estratégias, da mais provável à mais agressiva */
function qEstrategias(){
 const regioes=[{x:0,y:0,w:1,h:1},{x:0.05,y:0.2,w:0.9,h:0.6},{x:0.15,y:0.28,w:0.7,h:0.44},{x:0,y:0.12,w:1,h:0.76}];
 const saida=[];
 /* 1) o mais provável primeiro: a foto como está, clara e já em cinza com contraste */
 saida.push({rot:0,maxLado:2000});
 saida.push({rot:0,maxLado:2000,cinza:true,contraste:1.8});
 saida.push({rot:0,maxLado:2000,cinza:true,contraste:2.4,nitidez:true});
 /* 2) recorte central: código pequeno no meio da etiqueta fica grande */
 saida.push({rot:0,maxLado:2000,cinza:true,contraste:1.8,regiao:regioes[1]});
 saida.push({rot:0,maxLado:2000,cinza:true,contraste:2.4,nitidez:true,regiao:regioes[2]});
 /* 3) ampliação: mesma foto em resolução maior (código longe) */
 saida.push({rot:0,maxLado:2600,cinza:true,contraste:2,regiao:regioes[3]});
 /* 4) girada, para foto tirada de lado */
 for(const rot of [90,270]){
  saida.push({rot,maxLado:2000});
  saida.push({rot,maxLado:2000,cinza:true,contraste:2});
 }
 /* 5) última cartada: 180° e contraste forte */
 saida.push({rot:180,maxLado:1800,cinza:true,contraste:2.2});
 return saida;
}
/* tenta em duas ondas: a primeira rápida (imagem crua e cinza), a segunda só se precisar.
   Assim a foto comum é lida em poucos décimos de segundo, sem passar por 30 recortes. */
async function qLerFotoRapido(file,aoProgredir){
 const img=(file&&file.getContext)?file:await qCarregarImagem(file);
 const lista=qEstrategias();
 let tentativas=0,motivoLib=null,primeiraFalha=null;
 for(let i=0;i<lista.length;i++){
  const est=lista[i];
  tentativas++;
  if(aoProgredir)aoProgredir(tentativas);
  let cv=qCanvas(img,est);
  if(est.regiao)cv=qRecorte(cv,est.regiao);
  let txt=null;
  try{txt=await qDetectarCanvas(cv)}catch(e){}
  if(!txt)txt=await qDetectarLib(cv);
  if(txt)return{codigo:txt,tentativas,motivo:null};
  /* depois das 5 primeiras tentativas, se nada, para e diz o motivo (não trava a interface) */
  if(i>=5&&!primeiraFalha)primeiraFalha=tentativas;
 }
 return{codigo:null,tentativas,motivo:motivoLib||"sem-leitura"};
}
/* devolve {codigo, tentativas, motivo} — motivo só quando não achou */
async function qLerFoto(file){return qLerFotoRapido(file)}

 if(typeof createImageBitmap==="function")return createImageBitmap(file);

  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("imagem"));im.src=fr.result};
  fr.onerror=()=>rej(new Error("arquivo"));fr.readAsDataURL(file);

}

 });
