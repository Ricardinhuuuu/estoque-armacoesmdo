function csv(name,rows){
 const s="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const blob=new Blob([s],{type:"text/csv;charset=utf-8;"});

function refKey(d){const m=/([0-9A-Z]{8,})\s*-\s*(C\d+)/i.exec(d);return m?(m[1]+m[2]).toUpperCase():null}
let RX={};function rerx(){RX={};PP.forEach(p=>{const k=refKey(p[1]);if(k)RX[k]=RX[k]===undefined?p[0]:null})}
const reidx=()=>{idx={};PP.forEach((p,i)=>idx[p[0]]=i);rerx()};reidx();
function resolve(raw){const c=String(raw).trim();if(idx[c]!=null)return c;const d=c.replace(/\D/g,"");if(d&&idx[d]!=null)return d;
 const k=Object.keys(idx).find(k=>k.length>=8&&c.includes(k));if(k)return k;const u=c.toUpperCase().replace(/[\s\-]/g,"");if(RX[u])return RX[u];return c}

async function H(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mdo|"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const ch of "mdo|"+s)h=(h*33)^ch.charCodeAt(0);return"f"+(h>>>0).toString(16)}}

function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(ok){initAudio();
 try{const t=audioCtx.currentTime,s=ok?[[2600,0],[3300,.13]]:[[180,0],[140,.22]],d=ok?.12:.25;
  s.forEach(([f,o])=>{const a=audioCtx.createOscillator(),g=audioCtx.createGain();a.type=ok?"square":"sawtooth";a.frequency.value=f;g.gain.setValueAtTime(1,t+o);g.gain.exponentialRampToValueAtTime(.01,t+o+d);a.connect(g);g.connect(audioCtx.destination);a.start(t+o);a.stop(t+o+d)})}catch(e){}
 if(navigator.vibrate)navigator.vibrate(ok?90:[100,60,100])}

 else if(a==="cc"){CNT={};sv("mdo_cnt",CNT)}

 else if(a==="dp"){const c=$("pC").value.trim();if(idx[c]==null)return alert("Código não encontrado no cadastro.");

 else if(a==="rp"){const A=$("rA").value,B=$("rB").value,t0=A?new Date(A+"T00:00:00").getTime():0,t1=B?new Date(B+"T23:59:59.999").getTime():Infinity,R={};
  M.filter(m=>m.ts>=t0&&m.ts<=t1).forEach(m=>{const r=R[m.c]||(R[m.c]={i:0,o:0,a:0});if(m.t==="in")r.i+=m.q;else if(m.t==="out")r.o+=m.q;else r.a+=m.q});
  const b=bal();return csv("relatorio_movimentacoes.csv",[["Código","Descrição","Cor","Entradas","Saídas","Ajustes","Saldo atual"]].concat(Object.keys(R).map(c=>{const p=PP[idx[c]],r=R[c];return[c,p?p[1]:"",p?p[2]:"",r.i,r.o,r.a,p?b[idx[c]]:""]})))}
 else if(a==="rs"){const lm={};M.forEach(m=>{if(!lm[m.c]||m.ts>lm[m.c])lm[m.c]=m.ts});const lim=Date.now()-30*864e5,b=bal();
  return csv("sem_movimentacao_30_dias.csv",[["Código","Descrição","Cor","Saldo atual","Última movimentação"]].concat(PP.map((p,k)=>[p,k]).filter(([p])=>!lm[p[0]]||lm[p[0]]<lim).map(([p,k])=>[p[0],p[1],p[2],b[k],lm[p[0]]?fmt(lm[p[0]]):"Nunca"])))}
 else if(a==="exA")return csv("auditoria.csv",[["Data/Hora","Usuário","Ação","Detalhe"]].concat(AUD.map(x=>[fmt(x.ts),x.u,x.a,x.d])));
 else if(a==="imp")return $("imp").click();

 else if(a==="exE"){const b=bal();return csv("estoque_atual.csv",[["Código","Descrição","Cor","Estoque inicial","Saldo atual","Mínimo"]].concat(PP.map((p,k)=>[p[0],p[1],p[2],p[3],b[k],MIN[p[0]]||0])))}

 catch(x){alert("Arquivo de backup inválido.")}};
$("imp").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{await loadLib("xl")}catch(e){return alert("Leitor de planilha não carregou. Verifique a internet e tente de novo.")}

async function camOff(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}$("cam").style.display="none";$("camBtn").textContent="📷 Ligar câmera (Leitura Automática)";$("camMsg").textContent=""}
const FMT=["code_128","ean_13","qr_code"];
function camErr(e){const n=(e&&e.name)||String(e);
 if(n==="NotAllowedError"||n==="PermissionDeniedError")return"Câmera bloqueada. No iPhone: Ajustes › Safari › Câmera › Permitir (e abra o app direto no Safari, não dentro do WhatsApp/Instagram). Ou use a foto/digite abaixo.";
 if(n==="NotFoundError"||n==="DevicesNotFoundError")return"Nenhuma câmera encontrada neste aparelho. Use a foto ou digite abaixo.";
 if(n==="NotReadableError"||n==="TrackStartError")return"A câmera está em uso por outro app. Feche os outros apps e toque de novo.";
 if(n==="SecurityError"||!window.isSecureContext)return"A câmera só funciona em página segura (https). Abra pelo link https do app.";
 return"Não foi possível abrir a câmera ("+n+"). Toque de novo, ou use a foto/digite abaixo."}
const dedupe=t=>{const n=Date.now();if(t===last&&n-lastT<1500)return;last=t;lastT=n;scan(t)};
function addLaser(box){const z=document.createElement("div");z.id="lz";z.innerHTML='<div class="ln"></div>';box.appendChild(z)}
async function focusCont(track){try{const c=track.getCapabilities&&track.getCapabilities();if(c&&c.focusMode&&c.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}}
/* Motor 1 (mais rápido, sem internet): leitor nativo do navegador (Android/Chrome) */
async function nativeOK(){try{if(!("BarcodeDetector" in window))return null;const sup=await BarcodeDetector.getSupportedFormats(),f=FMT.filter(x=>sup.includes(x));return f.includes("code_128")?f:null}catch(e){return null}}
async function startNative(box,f){
 const det=new BarcodeDetector({formats:f});let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})}
 catch(e){if(e&&e.name==="OverconstrainedError")stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw e}
 const v=document.createElement("video");v.setAttribute("playsinline","");v.muted=true;v.autoplay=true;v.style.cssText="width:100%;display:block;aspect-ratio:16/9;object-fit:cover";v.srcObject=stream;box.appendChild(v);
 try{await v.play()}catch(e){}
 focusCont(stream.getVideoTracks()[0]);let on=true;
 (async()=>{while(on){try{if(v.readyState>=2){const r=await det.detect(v);if(r.length)dedupe(r[0].rawValue)}}catch(e){}await new Promise(r=>setTimeout(r,40))}})();
 return{stop:async()=>{on=false;stream.getTracks().forEach(t=>t.stop())},clear:()=>{box.innerHTML=""}}}
/* Motor 2 (iPhone/Safari e demais): biblioteca html5-qrcode */
async function startLib(box){
 const F=Html5QrcodeSupportedFormats,o={verbose:false,formatsToSupport:[F.CODE_128,F.EAN_13,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
 const cfg={fps:30,aspectRatio:1.777,disableFlip:true,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.floor(h*.42)})};
 let q=new Html5Qrcode("cam",o);
 try{await q.start({facingMode:"environment"},{...cfg,videoConstraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}},dedupe,()=>{})}
 catch(e){try{await q.clear()}catch(x){}
  if(e&&(e.name==="NotAllowedError"||e.name==="NotReadableError"||e.name==="SecurityError"))throw e;
  q=new Html5Qrcode("cam",o);await q.start({facingMode:"environment"},cfg,dedupe,()=>{})}
 try{const tr=q.getRunningTrackCameraCapabilities();if(tr&&tr.focusMode&&tr.focusMode.isSupported("continuous"))await q.applyVideoConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
 return q}
$("camBtn").onclick=async()=>{initAudio();const box=$("cam"),msg=$("camMsg");
 if(sc)return camOff();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent=window.isSecureContext?"Este navegador não permite usar a câmera aqui. Use a foto ou digite abaixo.":camErr({name:"SecurityError"});return}
 box.style.display="block";msg.textContent="Iniciando câmera…";$("camBtn").disabled=true;
 try{
  const nf=await nativeOK();
  if(nf){try{sc=await startNative(box,nf)}catch(e){box.innerHTML="";if(e&&(e.name==="NotAllowedError"||e.name==="NotReadableError"))throw e;sc=null}}
  if(!sc){

   try{await loadLib("qr")}catch(e){throw{name:"LibFail"}}

  addLaser(box);
  msg.textContent="✅ Câmera ativa! Deixe o código dentro da faixa verde, a uns 10–15 cm.";$("camBtn").textContent="⏹ Desligar câmera";
 }catch(e){try{if(sc)await sc.stop()}catch(x){}sc=null;box.innerHTML="";box.style.display="none";
  msg.textContent=(e&&e.name==="LibFail")?"Não consegui carregar o leitor (internet fraca ou bloqueada). Toque em 'Ligar câmera' de novo, use a foto ou digite abaixo.":camErr(e)}
