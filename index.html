 r.innerHTML='<h3>'+(mode==="out"?"⬇ Baixa registrada":"⬆ Entrada registrada")+' · '+qty+' un.</h3><div><b>'+p[1]+'</b></div><div class="mu">Cor: '+p[2]+' · '+c+'</div><div class="mu">Saldo atual</div><div class="big'+(b<0?" neg":"")+'">'+b+'</div>'+(b<0?'<div class="neg"><b>⚠ Saldo negativo</b></div>':b===0?'<div><b>⚠ Estoque zerado</b></div>':"");
 beep(true);draw();
}

function fmt(ts){return new Date(ts).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"medium"})}

function draw(){
 const b=bal(),q=$("q").value.toLowerCase().trim();let z=0,t=0,h="";
 P.forEach((p,i)=>{t+=b[i];if(b[i]<=0)z++;if(!q||(p[0]+" "+p[1]+" "+p[2]).toLowerCase().includes(q))h+='<div class="item"><div><b>'+p[1]+'</b><div class="mu">'+p[0]+' · '+p[2]+'</div></div><span class="pill'+(b[i]<0?" n":b[i]===0?" z":"")+'">'+b[i]+'</span></div>'});
 $("lst").innerHTML=h||'<div class="mu">Nada encontrado.</div>';$("tP").textContent=P.length;$("tN").textContent=z;$("tQ").textContent=t;
 $("log").innerHTML=M.length?M.slice().reverse().slice(0,200).map(m=>'<div class="item"><div><span class="tag '+(m.t==="out"?"o":"i")+'">'+(m.t==="out"?"BAIXA":"ENTRADA")+'</span> <b>'+(P[idx[m.c]]?P[idx[m.c]][1]:m.c)+'</b><div class="mu">'+fmt(m.ts)+' · '+m.o.replace(/</g,"")+'</div></div><b>'+m.q+'</b></div>').join(""):'<div class="mu">Nenhuma movimentação ainda.</div>';
}

function csv(name,rows){
 const s="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const blob=new Blob([s],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},100);
}

function mode_(m){mode=m;$("mO").classList.toggle("on",m==="out");$("mI").classList.toggle("on",m==="in")}
$("mO").onclick=()=>mode_("out");$("mI").onclick=()=>mode_("in");
$("qm").onclick=()=>{qty=Math.max(1,qty-1);$("qv").textContent=qty};$("qp").onclick=()=>{qty++;$("qv").textContent=qty};
$("go").onclick=()=>{initAudio();scan($("man").value);$("man").value="";$("man").focus()};
$("man").onkeydown=e=>{if(e.key==="Enter")$("go").onclick()};
$("op").oninput=()=>{try{localStorage.setItem("mdo_op",$("op").value)}catch(e){}};
$("q").oninput=draw;
$("undo").onclick=()=>{if(M.length&&confirm("Desfazer a última bipada?")){M.pop();save();draw();$("res").className="card res";$("res").innerHTML='<div class="mu">Última bipada desfeita.</div>'}};
$("clr").onclick=()=>{if(confirm("Apagar TODAS as movimentações deste aparelho? Exporte antes.")){M=[];save();draw()}};
$("exL").onclick=()=>csv("log_movimentacoes.csv",[["Nº","Tipo","Data/Hora","Operador","Código","Produto","Qtd"]].concat(M.map((m,i)=>[i+1,m.t==="out"?"Baixa":"Entrada",fmt(m.ts),m.o,m.c,P[idx[m.c]]?P[idx[m.c]][1]:"",m.q])));
$("exE").onclick=()=>{const b=bal();csv("estoque_atual.csv",[["Código","Descrição","Cor","Estoque inicial","Saldo atual"]].concat(P.map((p,i)=>[p[0],p[1],p[2],p[3],b[i]])))};

$("camBtn").onclick=async()=>{
 initAudio();
 const box=$("cam"),msg=$("camMsg");
 if(sc){
  try{await sc.stop();sc.clear()}catch(e){}
  sc=null;box.style.display="none";$("camBtn").textContent="📷 Ligar câmera (Leitura Automática)";msg.textContent="";return;
 }
 if(!window.Html5Qrcode){msg.textContent="Leitor de câmera não carregou. Verifique a internet ou digite abaixo.";return}
 box.style.display="block";msg.textContent="Iniciando câmera e foco automático…";

 // Configura especificamente para códigos de barras lineares (Code 128 / Code 39 / EAN)
 const formats=typeof Html5QrcodeSupportedFormats!=="undefined"?[
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.EAN_13,
  Html5QrcodeSupportedFormats.ITF
 ]:undefined;

 try{
  sc=new Html5Qrcode("cam",{formatsToSupport:formats,verbose:false});
  const config={
   fps:15, // Maior taxa de leitura por segundo para resposta imediata ao focar
   qrbox:(w,h)=>({width:Math.min(Math.floor(w*0.88),340),height:Math.min(Math.floor(h*0.38),110)}), // Mira retangular fina ideal para etiquetas
   aspectRatio:1.777,
   experimentalFeatures:{useBarCodeDetectorIfSupported:true}, // Usa leitor nativo acelerado do celular (Android/iOS) se disponível
   videoConstraints:{
    facingMode:"environment",
    width:{ideal:1280},
    height:{ideal:720},
    focusMode:"continuous"
   }
  };

  await sc.start(
   {facingMode:"environment"},
   config,
   t=>{
    const n=Date.now();
    // Evita bipar 2x seguidas acidentalmente a mesma peça em menos de 2 segundos
    if(t===last&&n-lastT<2000)return;
    last=t;lastT=n;
    // Pisca a borda da câmera em verde ao bipar
    box.style.borderColor="#16a34a";
    setTimeout(()=>{if(box)box.style.borderColor="var(--b)"},350);
    scan(t);
   },
   ()=>{}
  );

  // Tenta forçar foco contínuo na lente caso o aparelho suporte
  try{
   const track=sc.getRunningTrackCameraCapabilities();
   if(track&&track.focusMode&&track.focusMode.isSupported("continuous")){
    await sc.applyVideoConstraints({advanced:[{focusMode:"continuous"}]});
   }
  }catch(e){}

  msg.textContent="✅ Câmera ativa! Enquadre o código de barras na faixa para bipar automaticamente.";
  $("camBtn").textContent="⏹ Desligar câmera";
 }catch(e){
  sc=null;box.style.display="none";
  msg.textContent="Não foi possível abrir a câmera ao vivo ("+((e&&e.name)||e)+"). Verifique a permissão de câmera ou use o botão de foto.";
 }
};

$("phBtn").onclick=()=>{initAudio();$("ph").click()};
$("ph").onchange=async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 const msg=$("camMsg");
 if(!window.Html5Qrcode){msg.textContent="Leitor não carregou. Digite o código abaixo.";return}
 msg.textContent="Lendo a foto…";
 try{
  const r=new Html5Qrcode("hid");
  const t=await r.scanFile(f,false);
  msg.textContent="";scan(t);
 }catch(x){
  beep(false);
  msg.textContent="Não consegui ler o código na foto. Chegue mais perto, com boa luz e o código na horizontal, ou digite abaixo.";
 }
};

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll(".sec").forEach((s,i)=>s.classList.toggle("on",i==b.dataset.t));
 draw();
});
draw();
