<script>
/* Carregador com várias fontes e nova tentativa: se uma falhar, tenta a próxima */
const LIBS={
 qr:{ok:()=>!!window.Html5Qrcode,u:["https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js","https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js","https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"]},
 xl:{ok:()=>!!window.XLSX,u:["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"]}};
function loadLib(k){const L=LIBS[k];if(L.ok())return Promise.resolve();if(L.p)return L.p;
 const one=u=>new Promise((res,rej)=>{const s=document.createElement("script");let d=false;const end=f=>{if(d)return;d=true;clearTimeout(t);f()};
  const t=setTimeout(()=>end(()=>{s.remove();rej()}),9000);
  s.onload=()=>end(()=>L.ok()?res():(s.remove(),rej()));s.onerror=()=>end(()=>{s.remove();rej()});s.src=u;document.head.appendChild(s)});
 L.p=(async()=>{for(let r=0;r<2;r++)for(const u of L.u){try{await one(u);return}catch(e){}}throw new Error("lib")})().catch(e=>{L.p=null;throw e});return L.p}
loadLib("qr").catch(()=>{});loadLib("xl").catch(()=>{});
</script>
<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#0f1f3d;--mu:#5b6b88;--b:#1d4ed8;--b2:#2563eb;--bl:#dbe7ff;--r:#dc2626;--rl:#fee2e2;--ok:#16a34a;--y:#fef3c7;--bd:#d6e0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1326;--card:#13203f;--tx:#e8eefc;--mu:#9fb0d1;--bl:#1e3a8a;--rl:#5b1a1a;--y:#4a3b0a;--bd:#243764;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
header{background:linear-gradient(135deg,#1e3a8a,var(--b2));color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:19px}header small{opacity:.85}
.op{display:flex;gap:8px;align-items:center;margin-top:10px}.op input{flex:1;border:0;border-radius:10px;padding:10px 12px;font-size:15px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,58,138,.07)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bl);padding:5px;border-radius:14px}
.seg button{border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px;background:transparent;color:var(--tx)}
.seg button.on.out{background:var(--r);color:#fff}.seg button.on.in{background:var(--b);color:#fff}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;background:var(--b);color:#fff;width:100%;cursor:pointer}
.btn.red{background:var(--r)}.btn.ghost{background:var(--bl);color:var(--tx)}
#cam{border-radius:14px;overflow:hidden;margin-top:10px;display:none;border:3px solid var(--b);position:relative;background:#000}
#cam video{object-fit:cover}
.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;min-width:0;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font-size:16px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:42px;height:46px;border:0;border-radius:12px;background:var(--bl);color:var(--tx);font-size:22px;font-weight:700}.qty b{min-width:30px;text-align:center;font-size:18px}
.res{border-left:6px solid var(--b)}.res.err{border-color:var(--r);background:var(--rl)}.res.okout{border-color:var(--r)}
.res h3{margin:0 0 4px;font-size:15px}.big{font-size:34px;font-weight:800;color:var(--b)}.res.err .big,.neg{color:var(--r)}
.mu{color:var(--mu);font-size:13px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.pill{border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;background:var(--bl);height:fit-content;white-space:nowrap}
.pill.z{background:var(--y)}.pill.n{background:var(--rl);color:var(--r)}.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff}.tag.o{background:var(--r)}.tag.i{background:var(--b)}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:transparent;color:var(--mu);padding:8px;font-weight:700;font-size:13px;border-radius:10px}nav button.on{color:var(--b);background:var(--bl)}
.sec{display:none}.sec.on{display:block}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.sum b{display:block;font-size:22px;color:var(--b)}.sum div:nth-child(2) b{color:var(--r)}
.flash{animation:f .4s}@keyframes f{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
nav{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}.seg{grid-template-columns:repeat(3,1fr)}.seg button.on.cnt{background:#0f766e;color:#fff}.tag.a{background:#0f766e}
.btn+.btn{margin-top:8px}h3{margin:0 0 8px;font-size:16px}
.in{width:100%;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;font-size:16px;margin-top:8px}
#lg{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}#lg .card{width:100%;max-width:380px}#lgE{color:var(--r);font-weight:700;margin-top:8px;min-height:20px}

async function camOff(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}$("cam").style.display="none";$("camBtn").textContent="📷 Ligar câmera (Leitura Automática)";$("camMsg").textContent=""}
const FMT=["code_128","ean_13","qr_code"];
function camErr(e){const n=(e&&e.name)||String(e);
 if(n==="NotAllowedError"||n==="PermissionDeniedError")return"Câmera bloqueada. No iPhone: Ajustes › Safari › Câmera › Permitir (e abra o app direto no Safari, não dentro do WhatsApp/Instagram). Ou use a foto/digite abaixo.";
 if(n==="NotFoundError"||n==="DevicesNotFoundError")return"Nenhuma câmera encontrada neste aparelho. Use a foto ou digite abaixo.";
 if(n==="NotReadableError"||n==="TrackStartError")return"A câmera está em uso por outro app. Feche os outros apps e toque de novo.";
 if(n==="SecurityError"||!window.isSecureContext)return"A câmera só funciona em página segura (https). Abra pelo link https do app.";
 return"Não foi possível abrir a câmera ("+n+"). Toque de novo, ou use a foto/digite abaixo."}
const dedupe=t=>{const n=Date.now();if(t===last&&n-lastT<1500)return;last=t;lastT=n;scan(t)};

async function focusCont(track){try{const c=track.getCapabilities&&track.getCapabilities();if(c&&c.focusMode&&c.focusMode.includes("continuous"))await track.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}}
/* Motor 1 (mais rápido, sem internet): leitor nativo do navegador (Android/Chrome) */
async function nativeOK(){try{if(!("BarcodeDetector" in window))return null;const sup=await BarcodeDetector.getSupportedFormats(),f=FMT.filter(x=>sup.includes(x));return f.includes("code_128")?f:null}catch(e){return null}}
async function startNative(box,f){
 const det=new BarcodeDetector({formats:f});let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false})}
 catch(e){if(e&&e.name==="OverconstrainedError")stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw e}
 const v=document.createElement("video");v.setAttribute("playsinline","");v.muted=true;v.autoplay=true;v.style.cssText="width:100%;display:block;aspect-ratio:16/9;object-fit:cover";v.srcObject=stream;box.appendChild(v);
 try{await v.play()}catch(e){}
 focusCont(stream.getVideoTracks()[0]);let on=true;
 (async()=>{while(on){try{if(v.readyState>=2){const r=await det.detect(v);if(r.length)dedupe(r[0].rawValue)}}catch(e){}await new Promise(r=>setTimeout(r,40))}})();
 return{stop:async()=>{on=false;stream.getTracks().forEach(t=>t.stop())},clear:()=>{box.innerHTML=""}}}
/* Motor 2 (iPhone/Safari e demais): biblioteca html5-qrcode */
async function startLib(box){
 const F=Html5QrcodeSupportedFormats,o={verbose:false,formatsToSupport:[F.CODE_128,F.EAN_13,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}};
 const cfg={fps:30,aspectRatio:1.777,disableFlip:true,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.floor(h*.42)})};
 let q=new Html5Qrcode("cam",o);
 try{await q.start({facingMode:"environment"},{...cfg,videoConstraints:{facingMode:"environment",width:{ideal:1280},height:{ideal:720}}},dedupe,()=>{})}
 catch(e){try{await q.clear()}catch(x){}
  if(e&&(e.name==="NotAllowedError"||e.name==="NotReadableError"||e.name==="SecurityError"))throw e;
  q=new Html5Qrcode("cam",o);await q.start({facingMode:"environment"},cfg,dedupe,()=>{})}
 try{const tr=q.getRunningTrackCameraCapabilities();if(tr&&tr.focusMode&&tr.focusMode.isSupported("continuous"))await q.applyVideoConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
 return q}

  msg.textContent=(e&&e.name==="LibFail")?"Não consegui carregar o leitor (internet fraca ou bloqueada). Toque em 'Ligar câmera' de novo, use a foto ou digite abaixo.":camErr(e)}
