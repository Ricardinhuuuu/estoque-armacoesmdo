function scan(raw){if(!cur)return;let c=String(raw).trim();if(!c)return;
 if(idx[c]==null){const d=c.replace(/\D/g,"");if(d&&idx[d]!=null)c=d}

 let b=bal()[i];
 if(mode==="out"&&b<qty){
  if(!isA()){REQ.push({c,q:qty,u:cur.l,o:cur.n,ts:Date.now()});sv("mdo_req",REQ);beep(false);card("err","<h3>⛔ Saldo insuficiente ("+b+")</h3><b>"+esc(p[1])+"</b><div class='mu'>Baixa bloqueada. Solicitação enviada ao administrador para aprovação.</div>");draw();return}
  if(!confirm("Saldo insuficiente ("+b+"). Dar baixa mesmo assim?"))return}

 draw()}

function act(a,i){
 if(a==="ok"){const r=REQ[i];reg("out",r.c,r.q,{o:r.o,u:r.u,ap:cur.l});REQ.splice(i,1);sv("mdo_req",REQ)}
 else if(a==="no"){REQ.splice(i,1);sv("mdo_req",REQ)}
 else if(a==="wa"){const b=bal(),t="⚠ Estoque baixo (MDO):\n"+PP.map((p,k)=>[p,b[k]]).filter(([p,v])=>MIN[p[0]]>0&&v<=MIN[p[0]]).map(([p,v])=>"• "+p[1]+" "+p[2]+": "+v+" (mín. "+MIN[p[0]]+")").join("\n");window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");return}

function backup(){const d=new Date().toISOString().slice(0,10),u=URL.createObjectURL(new Blob([JSON.stringify({v:2,P:PP,min:MIN,m:M,u:U})],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="backup_estoque_mdo_"+d+".json";document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},200)}

  Object.keys(d.min||{}).forEach(k=>{if(MIN[k]==null)MIN[k]=d.min[k]});
  const ks=new Set(M.map(m=>m.ts+"|"+m.c+"|"+m.t+"|"+m.u));(d.m||[]).forEach(m=>{if(!ks.has(m.ts+"|"+m.c+"|"+m.t+"|"+m.u)){M.push(m);nm++}});M.sort((a,b)=>a.ts-b.ts);

$("imp").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;

 try{const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
  let hi=R.findIndex(r=>r.some(v=>/c[oó]d/i.test(v)));if(hi<0)hi=0;

{const s=ls("mdo_s",null);if(s&&U.some(x=>x.l===s))enter(s);else showLogin()}
